[package]
name = "ctw-rust"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "Native Rust groundwork for Chinatown Wars PSP, using the user's ISO"

[dependencies]
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
minifb = "0.28.0"

[profile.release]
opt-level = 3


[package]
name = "regta-ctw"
version = "0.1.2-alpha"
edition = "2021"
license = "GPL-3.0-only"
description = "ReGTA CTW PSP Recomp: native Rust research port for Chinatown Wars PSP"
publish = false

[[bin]]
name = "ctw-rust"
path = "../../src/main.rs"

[dependencies]
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
minifb = "0.28.0"


